apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trino-gateway.fullname" . }}-configuration
  labels:
    {{- include "trino-gateway.labels" . | nindent 4 }}
type: "Opaque"
data:
  config.yaml: {{ .Values.config | toYaml | b64enc | quote }}
  routing_rules.yml: {{ .Files.Get "files/routing_rules.yml" | b64enc | quote }}
